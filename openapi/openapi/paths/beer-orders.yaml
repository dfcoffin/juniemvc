get:
  tags:
    - BeerOrder
  summary: Get all beer orders
  description: |
    Returns a list of all beer orders in the system.
    This endpoint retrieves all beer orders with their complete details, including order lines, status, and payment information.
  operationId: getAllBeerOrders
  security:
    - api_key: [ ]
  responses:
    '200':
      description: Successfully retrieved the list of beer orders
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../components/schemas/BeerOrderDto.yaml'
          example:
            - id: 1
              version: 0
              customerRef: "Customer123"
              paymentAmount: 59.94
              orderStatus: "COMPLETE"
              beerOrderLines:
                - id: 1
                  version: 0
                  beerId: 1
                  beerName: "Mango Bobs"
                  beerStyle: "IPA"
                  upc: "0631234200036"
                  price: 12.99
                  orderQuantity: 2
                  quantityAllocated: 2
                  lineStatus: "ALLOCATED"
                  createDate: "2023-01-15T12:00:00Z"
                  updateDate: "2023-01-15T12:00:00Z"
                - id: 2
                  version: 0
                  beerId: 2
                  beerName: "Galaxy Cat"
                  beerStyle: "PALE_ALE"
                  upc: "0631234300019"
                  price: 11.99
                  orderQuantity: 3
                  quantityAllocated: 3
                  lineStatus: "ALLOCATED"
                  createDate: "2023-01-15T12:00:00Z"
                  updateDate: "2023-01-15T12:00:00Z"
              createDate: "2023-01-15T12:00:00Z"
              updateDate: "2023-01-15T12:00:00Z"
    '400':
      description: Bad request - Invalid request format or parameters
    '401':
      description: Unauthorized - Authentication required
    '403':
      description: Forbidden - Insufficient permissions to access beer orders

post:
  tags:
    - BeerOrder
  summary: Create a new beer order
  description: |
    Creates a new beer order in the system.
    This endpoint requires a valid beer order with customer reference, payment amount, and at least one beer order line.
    The system will automatically populate additional information such as beer details, order status, and timestamps.
  operationId: createBeerOrder
  security:
    - api_key: [ ]
  requestBody:
    description: Beer order object to be created
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/BeerOrderDto.yaml'
        example:
          customerRef: "Customer123"
          paymentAmount: 59.94
          beerOrderLines:
            - beerId: 1
              orderQuantity: 2
            - beerId: 2
              orderQuantity: 3
  responses:
    '201':
      description: Beer order created successfully with generated ID and system-populated fields
      content:
        application/json:
          schema:
            $ref: '../components/schemas/BeerOrderDto.yaml'
          example:
            id: 1
            version: 0
            customerRef: "Customer123"
            paymentAmount: 59.94
            orderStatus: "NEW"
            beerOrderLines:
              - id: 1
                version: 0
                beerId: 1
                beerName: "Mango Bobs"
                beerStyle: "IPA"
                upc: "0631234200036"
                price: 12.99
                orderQuantity: 2
                quantityAllocated: 0
                lineStatus: "NEW"
                createDate: "2023-01-15T12:00:00Z"
                updateDate: "2023-01-15T12:00:00Z"
              - id: 2
                version: 0
                beerId: 2
                beerName: "Galaxy Cat"
                beerStyle: "PALE_ALE"
                upc: "0631234300019"
                price: 11.99
                orderQuantity: 3
                quantityAllocated: 0
                lineStatus: "NEW"
                createDate: "2023-01-15T12:00:00Z"
                updateDate: "2023-01-15T12:00:00Z"
            createDate: "2023-01-15T12:00:00Z"
            updateDate: "2023-01-15T12:00:00Z"
    '400':
      description: "Bad request - validation error"
    '401':
      description: "Unauthorized"