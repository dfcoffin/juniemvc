parameters:
  - name: id
    in: path
    description: ID of the beer order
    required: true
    schema:
      type: integer
      format: int32
      minimum: 1
    example: 1

get:
  tags:
    - BeerOrder
  summary: Get a beer order by ID
  description: |
    Returns a single beer order by its ID.
    This endpoint retrieves complete details of a specific beer order, including order lines, status, and payment information.
  operationId: getBeerOrderById
  security:
    - api_key: [ ]
  responses:
    '200':
      description: Successfully retrieved the beer order
      content:
        application/json:
          schema:
            $ref: '../components/schemas/BeerOrderDto.yaml'
          example:
            id: 1
            version: 0
            customerRef: "Customer123"
            paymentAmount: 59.94
            orderStatus: "COMPLETE"
            beerOrderLines:
              - id: 1
                version: 0
                beerId: 1
                beerName: "Mango Bobs"
                beerStyle: "IPA"
                upc: "0631234200036"
                price: 12.99
                orderQuantity: 2
                quantityAllocated: 2
                lineStatus: "ALLOCATED"
                createDate: "2023-01-15T12:00:00Z"
                updateDate: "2023-01-15T12:00:00Z"
              - id: 2
                version: 0
                beerId: 2
                beerName: "Galaxy Cat"
                beerStyle: "PALE_ALE"
                upc: "0631234300019"
                price: 11.99
                orderQuantity: 3
                quantityAllocated: 3
                lineStatus: "ALLOCATED"
                createDate: "2023-01-15T12:00:00Z"
                updateDate: "2023-01-15T12:00:00Z"
            createDate: "2023-01-15T12:00:00Z"
            updateDate: "2023-01-15T12:00:00Z"
    '404':
      description: "Beer order not found"
    '401':
      description: "Unauthorized"

put:
  tags:
    - BeerOrder
  summary: Update a beer order
  description: |
    Updates an existing beer order by its ID.
    This endpoint requires a valid beer order with customer reference, payment amount, and at least one beer order line.
    The system will preserve the order ID and update other fields as specified in the request.
  operationId: updateBeerOrder
  security:
    - api_key: [ ]
  requestBody:
    description: Beer order object with updated information
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/BeerOrderDto.yaml'
        example:
          id: 1
          version: 0
          customerRef: "Customer123-Updated"
          paymentAmount: 59.94
          beerOrderLines:
            - id: 1
              beerId: 1
              beerName: "Mango Bobs"
              beerStyle: "IPA"
              upc: "0631234200036"
              orderQuantity: 2
              quantityAllocated: 10
              lineStatus: "NEW"
  responses:
    '200':
      description: Successfully updated the beer order
      content:
        application/json:
          schema:
            $ref: '../components/schemas/BeerOrderDto.yaml'
          example:
            id: 1
            version: 1
            customerRef: "Customer123-Updated"
            paymentAmount: 59.94
            orderStatus: "COMPLETE"
            beerOrderLines:
              - id: 1
                version: 0
                beerId: 1
                beerName: "Mango Bobs"
                beerStyle: "IPA"
                upc: "0631234200036"
                price: 12.99
                orderQuantity: 2
                quantityAllocated: 2
                lineStatus: "ALLOCATED"
                createDate: "2023-01-15T12:00:00Z"
                updateDate: "2023-01-15T12:00:00Z"
              - id: 2
                version: 0
                beerId: 2
                beerName: "Galaxy Cat"
                beerStyle: "PALE_ALE"
                upc: "0631234300019"
                price: 11.99
                orderQuantity: 3
                quantityAllocated: 3
                lineStatus: "ALLOCATED"
                createDate: "2023-01-15T12:00:00Z"
                updateDate: "2023-01-15T12:00:00Z"
            createDate: "2023-01-15T12:00:00Z"
            updateDate: "2023-01-15T13:30:00Z"
    '400':
      description: "Bad request - validation error"
    '404':
      description: "Beer order not found"
    '401':
      description: "Unauthorized"

delete:
  tags:
    - BeerOrder
  summary: Delete a beer order
  description: |
    Deletes a beer order by its ID.
    This operation permanently removes the beer order and all its associated order lines from the system.
    Once deleted, the order cannot be recovered.
  operationId: deleteBeerOrder
  security:
    - api_key: []
  responses:
    '204':
      description: "Successfully deleted the beer order"
    '404':
      description: "Beer order not found"
    '401':
      description: "Unauthorized"