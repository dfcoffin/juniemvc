parameters:
  - name: id
    in: path
    description: ID of the beer order to operate on
    required: true
    schema:
      type: integer
      format: int32

get:
  summary: Get a beer order by ID
  description: Returns a single beer order by its ID
  operationId: getBeerOrderById
  tags:
    - BeerOrder
  responses:
    '200':
      description: Beer order found
      content:
        application/json:
          schema:
            $ref: '../components/schemas/BeerOrderDto.yaml'
          example:
            id: 1
            version: 0
            customerRef: "Customer123"
            paymentAmount: 59.94
            orderStatus: "ALLOCATED"
            beerOrderLines:
              - id: 1
                version: 0
                beerId: 1
                beerName: "Mango Bobs"
                beerStyle: "IPA"
                upc: "0631234200036"
                price: 12.99
                orderQuantity: 2
                quantityAllocated: 2
                lineStatus: "ALLOCATED"
                createDate: "2023-01-15T12:00:00Z"
                updateDate: "2023-01-15T12:00:00Z"
              - id: 2
                version: 0
                beerId: 2
                beerName: "Galaxy Cat"
                beerStyle: "PALE_ALE"
                upc: "0631234300019"
                price: 11.99
                orderQuantity: 3
                quantityAllocated: 3
                lineStatus: "ALLOCATED"
                createDate: "2023-01-15T12:00:00Z"
                updateDate: "2023-01-15T12:00:00Z"
            createDate: "2023-01-15T12:00:00Z"
            updateDate: "2023-01-15T12:00:00Z"
    '404':
      description: Beer order not found

put:
  summary: Update a beer order
  description: Updates an existing beer order by its ID
  operationId: updateBeerOrder
  tags:
    - BeerOrder
  requestBody:
    description: Updated beer order information
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/BeerOrderDto.yaml'
        example:
          customerRef: "Customer123-Updated"
          paymentAmount: 59.94
          beerOrderLines:
            - beerId: 1
              orderQuantity: 2
            - beerId: 2
              orderQuantity: 3
  responses:
    '200':
      description: Beer order updated successfully
      content:
        application/json:
          schema:
            $ref: '../components/schemas/BeerOrderDto.yaml'
          example:
            id: 1
            version: 1
            customerRef: "Customer123-Updated"
            paymentAmount: 59.94
            orderStatus: "ALLOCATED"
            beerOrderLines:
              - id: 1
                version: 0
                beerId: 1
                beerName: "Mango Bobs"
                beerStyle: "IPA"
                upc: "0631234200036"
                price: 12.99
                orderQuantity: 2
                quantityAllocated: 2
                lineStatus: "ALLOCATED"
                createDate: "2023-01-15T12:00:00Z"
                updateDate: "2023-01-15T12:00:00Z"
              - id: 2
                version: 0
                beerId: 2
                beerName: "Galaxy Cat"
                beerStyle: "PALE_ALE"
                upc: "0631234300019"
                price: 11.99
                orderQuantity: 3
                quantityAllocated: 3
                lineStatus: "ALLOCATED"
                createDate: "2023-01-15T12:00:00Z"
                updateDate: "2023-01-15T12:00:00Z"
            createDate: "2023-01-15T12:00:00Z"
            updateDate: "2023-01-15T13:30:00Z"
    '400':
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: '../components/schemas/Problem.yaml'
    '404':
      description: Beer order not found

delete:
  summary: Delete a beer order
  description: Deletes a beer order by its ID
  operationId: deleteBeerOrder
  tags:
    - BeerOrder
  responses:
    '204':
      description: Beer order deleted successfully
    '404':
      description: Beer order not found