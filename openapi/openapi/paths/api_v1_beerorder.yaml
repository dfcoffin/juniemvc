get:
  summary: Get all beer orders
  description: Returns a list of all beer orders in the system
  operationId: getAllBeerOrders
  tags:
    - BeerOrder
  responses:
    '200':
      description: A list of beer orders
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../components/schemas/BeerOrderDto.yaml'
          example:
            - id: 1
              version: 0
              customerRef: "Customer123"
              paymentAmount: 59.94
              orderStatus: "ALLOCATED"
              beerOrderLines:
                - beerId: 1
                  beerName: "Mango Bobs"
                  beerStyle: "IPA"
                  upc: "0631234200036"
                  price: 12.99
                  orderQuantity: 2
                  quantityAllocated: 2
                  lineStatus: "ALLOCATED"
                - beerId: 2
                  beerName: "Galaxy Cat"
                  beerStyle: "PALE_ALE"
                  upc: "0631234300019"
                  price: 11.99
                  orderQuantity: 3
                  quantityAllocated: 3
                  lineStatus: "ALLOCATED"
              createDate: "2023-01-15T12:00:00Z"
              updateDate: "2023-01-15T12:00:00Z"
    '400':
      description: Bad request
    '401':
      description: Unauthorized
    '403':
      description: Forbidden

post:
  summary: Create a new beer order
  description: Creates a new beer order in the system
  operationId: createBeerOrder
  tags:
    - BeerOrder
  requestBody:
    description: Beer order to create
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/BeerOrderDto.yaml'
        example:
          customerRef: "Customer123"
          paymentAmount: 59.94
          beerOrderLines:
            - beerId: 1
              orderQuantity: 2
            - beerId: 2
              orderQuantity: 3
  responses:
    '201':
      description: Beer order created successfully
      content:
        application/json:
          schema:
            $ref: '../components/schemas/BeerOrderDto.yaml'
          example:
            id: 1
            version: 0
            customerRef: "Customer123"
            paymentAmount: 59.94
            orderStatus: "NEW"
            beerOrderLines:
              - id: 1
                version: 0
                beerId: 1
                beerName: "Mango Bobs"
                beerStyle: "IPA"
                upc: "0631234200036"
                price: 12.99
                orderQuantity: 2
                quantityAllocated: 0
                lineStatus: "NEW"
                createDate: "2023-01-15T12:00:00Z"
                updateDate: "2023-01-15T12:00:00Z"
              - id: 2
                version: 0
                beerId: 2
                beerName: "Galaxy Cat"
                beerStyle: "PALE_ALE"
                upc: "0631234300019"
                price: 11.99
                orderQuantity: 3
                quantityAllocated: 0
                lineStatus: "NEW"
                createDate: "2023-01-15T12:00:00Z"
                updateDate: "2023-01-15T12:00:00Z"
            createDate: "2023-01-15T12:00:00Z"
            updateDate: "2023-01-15T12:00:00Z"
    '400':
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: '../components/schemas/Problem.yaml'
