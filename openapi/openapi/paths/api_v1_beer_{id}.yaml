parameters:
  - name: id
    in: path
    description: ID of the beer to operate on
    required: true
    schema:
      type: integer
      format: int32

get:
  summary: Get a beer by ID
  description: Returns a single beer by its ID
  operationId: getBeerById
  tags:
    - Beer
  responses:
    '200':
      description: Beer found
      content:
        application/json:
          schema:
            $ref: '../components/schemas/BeerDto.yaml'
          example:
            id: 1
            version: 0
            beerName: "Mango Bobs"
            beerStyle: "IPA"
            upc: "0631234200036"
            quantityOnHand: 122
            price: 12.99
            createDate: "2023-01-15T12:00:00Z"
            updateDate: "2023-01-15T12:00:00Z"
    '404':
      description: Beer not found

put:
  summary: Update a beer
  description: Updates an existing beer by its ID
  operationId: updateBeer
  tags:
    - Beer
  requestBody:
    description: Updated beer information
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/BeerDto.yaml'
        example:
          beerName: "Mango Bobs"
          beerStyle: "IPA"
          upc: "0631234200036"
          quantityOnHand: 150
          price: 13.99
  responses:
    '200':
      description: Beer updated successfully
      content:
        application/json:
          schema:
            $ref: '../components/schemas/BeerDto.yaml'
          example:
            id: 1
            version: 1
            beerName: "Mango Bobs"
            beerStyle: "IPA"
            upc: "0631234200036"
            quantityOnHand: 150
            price: 13.99
            createDate: "2023-01-15T12:00:00Z"
            updateDate: "2023-01-15T13:30:00Z"
    '400':
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: '../components/schemas/Problem.yaml'
    '404':
      description: Beer not found

delete:
  summary: Delete a beer
  description: Deletes a beer by its ID
  operationId: deleteBeer
  tags:
    - Beer
  responses:
    '204':
      description: Beer deleted successfully
    '404':
      description: Beer not found