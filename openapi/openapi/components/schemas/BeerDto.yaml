type: object
description: Data Transfer Object for Beer information
properties:
  id:
    type: integer
    format: int32
    description: Unique identifier for the beer
    readOnly: true
    example: 1
  version:
    type: integer
    format: int32
    description: Version number for optimistic locking
    readOnly: true
    example: 0
  beerName:
    type: string
    description: Name of the beer
    minLength: 3
    maxLength: 50
    example: "Mango Bobs"
  beerStyle:
    type: string
    description: Style of beer (Ale, Pale Ale, IPA, etc.)
    example: "IPA"
  upc:
    type: string
    description: Universal Product Code, a 13-digit number assigned to each unique beer product by the Federal Bar Association
    minLength: 12
    maxLength: 13
    example: "0631234200036"
  quantityOnHand:
    type: integer
    format: int32
    description: Current quantity of beer available in inventory
    minimum: 0
    example: 122
  price:
    type: number
    format: double
    description: Price of the beer
    exclusiveMinimum: 0
    maximum: 999999.99
    example: 12.99
  createDate:
    type: string
    format: date-time
    description: Date and time when the beer was created
    readOnly: true
    example: "2023-01-15T12:00:00Z"
  updateDate:
    type: string
    format: date-time
    description: Date and time when the beer was last updated
    readOnly: true
    example: "2023-01-15T12:00:00Z"
required:
  - beerName
  - beerStyle
  - upc
  - quantityOnHand
  - price
