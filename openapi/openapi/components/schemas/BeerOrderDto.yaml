type: object
description: Data Transfer Object for beer orders
properties:
  id:
    type: integer
    format: int32
    description: Unique identifier for the beer order (read-only)
    readOnly: true
    example: 1
  version:
    type: integer
    format: int32
    description: Version number for optimistic locking (read-only)
    readOnly: true
    example: 0
  customerRef:
    type: string
    description: Customer reference for the order (required)
    maxLength: 255
    minLength: 1
    example: "Customer123"
    x-constraint-message: "Customer reference is required"
  paymentAmount:
    type: number
    format: double
    description: Payment amount for the order (required, positive value with max 10 digits and 2 decimal places)
    exclusiveMinimum: 0
    x-digits:
      integer: 10
      fraction: 2
    example: 59.94
    x-constraint-message: "Payment amount is required, must be positive, and must have at most 10 digits and 2 decimal places"
  orderStatus:
    type: string
    description: Status of the order (system-managed)
    example: "NEW"
  beerOrderLines:
    type: array
    description: Line items in the beer order (required, must contain at least one beer)
    minItems: 1
    items:
      $ref: './BeerOrderLineDto.yaml'
    example:
      - beerId: 1
        beerName: "Mango Bobs"
        beerStyle: "IPA"
        upc: "0631234200036"
        price: 12.99
        orderQuantity: 2
        quantityAllocated: 2
        lineStatus: "ALLOCATED"
      - beerId: 2
        beerName: "Galaxy Cat"
        beerStyle: "PALE_ALE"
        upc: "0631234300019"
        price: 11.99
        orderQuantity: 3
        quantityAllocated: 3
        lineStatus: "ALLOCATED"
    x-constraint-message: "Order must contain at least one beer"
  createDate:
    type: string
    format: date-time
    description: Date and time when the order was created (read-only)
    readOnly: true
    example: "2023-01-15T12:00:00Z"
  updateDate:
    type: string
    format: date-time
    description: Date and time when the order was last updated (read-only)
    readOnly: true
    example: "2023-01-15T12:00:00Z"
required:
  - customerRef
  - paymentAmount
  - beerOrderLines
