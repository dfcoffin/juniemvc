type: object
description: Data Transfer Object for beer orders
properties:
  id:
    type: integer
    format: int32
    description: Unique identifier for the beer order
    readOnly: true
    example: 1
  version:
    type: integer
    format: int32
    description: Version number for optimistic locking
    readOnly: true
    example: 0
  customerRef:
    type: string
    description: Customer reference for the order
    maxLength: 255
    example: "Customer123"
  paymentAmount:
    type: number
    format: double
    description: Payment amount for the order
    exclusiveMinimum: 0
    maximum: 9999999999.99
    example: 59.94
  orderStatus:
    type: string
    description: Status of the order
    enum:
      - NEW
      - VALIDATED
      - VALIDATION_PENDING
      - VALIDATION_EXCEPTION
      - ALLOCATED
      - ALLOCATION_PENDING
      - ALLOCATION_EXCEPTION
      - PENDING_INVENTORY
      - PICKED_UP
      - DELIVERED
      - DELIVERY_EXCEPTION
      - CANCELLED
    example: "ALLOCATED"
  beerOrderLines:
    type: array
    description: Line items in the beer order
    minItems: 1
    items:
      $ref: './BeerOrderLineDto.yaml'
    example:
      - beerId: 1
        beerName: "Mango Bobs"
        beerStyle: "IPA"
        upc: "0631234200036"
        price: 12.99
        orderQuantity: 2
        quantityAllocated: 2
        lineStatus: "ALLOCATED"
      - beerId: 2
        beerName: "Galaxy Cat"
        beerStyle: "PALE_ALE"
        upc: "0631234300019"
        price: 11.99
        orderQuantity: 3
        quantityAllocated: 3
        lineStatus: "ALLOCATED"
  createDate:
    type: string
    format: date-time
    description: Date and time when the order was created
    readOnly: true
    example: "2023-01-15T12:00:00Z"
  updateDate:
    type: string
    format: date-time
    description: Date and time when the order was last updated
    readOnly: true
    example: "2023-01-15T12:00:00Z"
required:
  - customerRef
  - paymentAmount
  - beerOrderLines
