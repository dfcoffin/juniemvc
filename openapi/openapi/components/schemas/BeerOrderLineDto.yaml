type: object
description: Data Transfer Object for beer order line items
properties:
  id:
    type: integer
    format: int32
    description: Unique identifier for the beer order line
    readOnly: true
    example: 1
  version:
    type: integer
    format: int32
    description: Version number for optimistic locking
    readOnly: true
    example: 0
  beerId:
    type: integer
    format: int32
    description: ID of the beer being ordered
    example: 1
  beerName:
    type: string
    description: Name of the beer
    example: "Mango Bobs"
  beerStyle:
    type: string
    description: Style of beer (Ale, Pale Ale, IPA, etc.)
    example: "IPA"
  upc:
    type: string
    description: Universal Product Code of the beer
    example: "0631234200036"
  price:
    type: number
    format: double
    description: Price of the beer
    example: 12.99
  orderQuantity:
    type: integer
    format: int32
    description: Quantity of beer ordered
    minimum: 1
    example: 6
  quantityAllocated:
    type: integer
    format: int32
    description: Quantity of beer allocated from inventory
    example: 6
  lineStatus:
    type: string
    description: Status of the order line
    example: "NEW"
  createDate:
    type: string
    format: date-time
    description: Date and time when the order line was created
    readOnly: true
    example: "2023-01-15T12:00:00Z"
  updateDate:
    type: string
    format: date-time
    description: Date and time when the order line was last updated
    readOnly: true
    example: "2023-01-15T12:00:00Z"
required:
  - beerId
  - orderQuantity