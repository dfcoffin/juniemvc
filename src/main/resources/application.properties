spring.application.name=juniemvc

#Database Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.h2.console.enabled=true

# Instead of: spring.datasource.url=jdbc:h2:mem:testdb
# Use a file-based H2 database for persistence and external access:
spring.datasource.url=jdbc:h2:file:./data/myh2db;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Disable Open Session in View pattern
spring.jpa.open-in-view=false

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

#Logging Configuration
logging.level.com.zaxxer.hikari.HikariConfig=DEBUG
